name: Apply quality refactor

on:
  push:
    branches: [chore/portfolio-quality-standard]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/portfolio-quality-standard

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Apply Rector
        run: composer refactor

      - name: Apply Pint
        run: composer format

      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Itamar Junior"
          git config user.email "100168621+ItamarJuniorDEV@users.noreply.github.com"
          git add app routes tests
          git commit -m "refactor: explicitar contratos de tipos"
          git push origin HEAD:chore/portfolio-quality-standard
