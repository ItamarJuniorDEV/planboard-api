name: Refresh quality lock

on:
  push:
    branches: [chore/portfolio-quality-standard]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/portfolio-quality-standard

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Update quality dependencies
        run: composer update rector/rector larastan/larastan laravel/pint --with-all-dependencies --no-interaction --no-progress

      - name: Commit lockfile
        run: |
          if git diff --quiet composer.lock; then
            exit 0
          fi
          git config user.name "Itamar Junior"
          git config user.email "100168621+ItamarJuniorDEV@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: atualizar ferramentas de qualidade"
          git push origin HEAD:chore/portfolio-quality-standard
